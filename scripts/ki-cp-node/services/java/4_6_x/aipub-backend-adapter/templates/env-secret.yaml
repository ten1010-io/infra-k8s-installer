apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-envs
  labels:
    {{- include "aipub-backend-adapter.labels" . | nindent 4 }}
stringData:
  APP_DOMAIN_AUTH_BASIC_AUTH_PASSWORD: {{ .Values.applicationYaml.app.domain.auth.basicAuthPassword | quote }}
  APP_PROXY_KIBANA_ADMIN_PASSWORD: {{ .Values.applicationYaml.app.proxy.kibana.admin.password | quote }}
