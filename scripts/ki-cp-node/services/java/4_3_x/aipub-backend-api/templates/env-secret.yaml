apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-envs
  labels:
    {{- include "aipub-backend-api.labels" . | nindent 4 }}
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.applicationYaml.spring.dataSource.password | quote }}

  APP_DOMAIN_AUTH_INIT_PASSWORD: {{ .Values.applicationYaml.app.domain.auth.initPassword | quote }}
  APP_DOMAIN_HARBOR_PASSWORD: {{ .Values.applicationYaml.app.domain.harbor.password | quote }}
  APP_DOMAIN_HARBOR_DB_PASSWORD: {{ .Values.applicationYaml.app.domain.harbor.dbPassword | quote }}
  APP_DOMAIN_K8S_PROXY_K8S_MANAGER_TOKEN: {{ .Values.applicationYaml.app.domain.k8sProxy.k8sManagerToken | quote }}
  APP_DOMAIN_KEYCLOAK_CLIENT_SECRET: {{ .Values.applicationYaml.app.domain.keycloak.clientSecret | quote }}
  APP_DOMAIN_KEYCLOAK_USER_REALM_PUBLIC_KEY: {{ .Values.applicationYaml.app.domain.keycloak.userRealmPublicKey | quote }}
  APP_DOMAIN_KEYCLOAK_USER_PASSWORD: {{ .Values.applicationYaml.app.domain.keycloak.userPassword | quote }}

  APP_ES_CLIENT_PASSWORD: {{ .Values.applicationYaml.app.esClient.password | quote }}

  APP_JWT_SECRET_KEY: {{ .Values.applicationYaml.app.jwt.secretKey | quote }}

  APP_SIMPLEJAVAMAIL_SMTP_PASSWORD: {{ .Values.applicationYaml.app.simplejavamail.smtpPassword | quote }}
