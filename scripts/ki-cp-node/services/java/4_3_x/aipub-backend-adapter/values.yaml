replicaCount: 1

image:
  repository: "" # ## HELM installer ##
  pullPolicy: Always
  tag: "" # ## HELM installer ##

imagePullSecrets:
  - name: harbor-java
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: "aipub-backend-adapter"

podAnnotations:
  ad.datadoghq.com/aipub-backend-adapter.logs: '[{"source": "java", "service": "aipub-backend-adapter"}]'
podLabels: { }

podSecurityContext: { }

securityContext: { }

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "lb1"
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
  hosts:
    - host: "" # ## HELM installer ##
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: "" # ## HELM installer ##
      hosts:
        - "" # ## HELM installer ##

resources: { }

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes:
  - name: ca-certs
    secret:
      secretName: custom-ca-certs

volumeMounts:
  - mountPath: /certificates
    name: ca-certs
    readOnly: true

nodeSelector: { }

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

envFrom:
  configMapSuffix: envs
  secretSuffix: envs

applicationYaml:
  server:
    port: 8080
  spring:
    profiles:
      active: "production"
    cloud:
      gateway:
        server:
          webflux:
            userEmailValidity:
              id: "user_email_validity"
              uri: "no://op"
              predicatePath: "Path=/api/v1alpha1/users/email-validity-checks"
              predicateMethod: "Method=GET"
              filterName: "AipubUserAdapter"
            userUsernameValidity:
              id: "user_username_validity"
              uri: "no://op"
              predicatePath: "Path=/api/v1alpha1/users/username-validity-checks"
              predicateMethod: "Method=GET"
              filterName: "AipubUserAdapter"
            userCreate:
              id: "user_create"
              uri: "no://op"
              predicatePath: "Path=/api/v1alpha1/users"
              predicateMethod: "Method=POST"
              filterName: "AipubUserAdapter"
            userUpdatePassword:
              id: "user_update_password"
              uri: "no://op"
              predicatePath: "Path=/api/v1alpha1/users/*/password"
              predicateMethod: "Method=PATCH"
              filterName: "AipubUserAdapter"
            userResetPassword:
              id: "user_reset_password"
              uri: "no://op"
              predicatePath: "Path=/api/v1alpha1/users/*/resetpassword"
              predicateMethod: "Method=PUT"
              filterName: "AipubUserAdapter"
            aipubBackend:
              id: "backend_gateway"
              uri: "http://aipub-backend-gateway.aipub.svc.cluster.local:8080"
              predicates:
                path: "Path=/api/**"
              filters:
                aipubAdapter:
                  name: "WelcomeAdapter"
            aipubBackendSwagger:
              id: "backend_gateway_swagger"
              uri: "http://aipub-backend-gateway.aipub.svc.cluster.local:8080"
              predicates:
                path: "Path=/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**"
            aipubFrontend:
              id: "aipub_frontend"
              uri: "http://aipub-frontend.aipub.svc.cluster.local"
              predicates:
                path: "Path=/**"
              filters:
                aipubAdapter:
                  name: "WelcomeAdapter"
            kibana:
              id: "kibana"
              predicates:
                path: "Path=/kibana/**"
              uri: "https://kibana-kibana.aipub-efk.svc.cluster.local:5601"
              filters:
                basicAuthAdapter:
                  name: "BasicAuthAdapter"
                  args:
                    adminUser: "elastic"
                    adminPassword: "" # ## HELM installer ##
                    userUser: aipub
                    userPassword: "aipub1@"
                removeRequestHeader:
                  name: "RemoveRequestHeader"
                  args:
                    name: "Cookie"
            streamlit:
              id: "streamlit_main"
              uri: "http://aipub-monitoring.aipub.svc.cluster.local:8501"
              predicates:
                path: "Path=/streamlit/**"
              filters:
                name: "BearerAuthAdapter"
            notice:
              id: "notice_main"
              uri: "http://aipub-notice-board-api.aipub-efk.svc.cluster.local:8009"
              predicates:
                path: "Path=/notice/**"
              filters:
                arg: "StripPrefix=1"
            alloc:
              id: "alloc_main"
              uri: "http://aipub-cluster-overview-api.aipub-promstack.svc.cluster.local:8008"
              predicates:
                path: "Path=/alloc/**"
              filters:
                arg: "StripPrefix=1"
            report:
              id: "report_main"
              uri: "http://aipub-report.aipub.svc.cluster.local:8000"
              predicates:
                path: "Path=/report/**"
              filters:
                arg: "StripPrefix=1"
            webterminal:
              id: "webterminal"
              uri: "http://placeholder:7681"
              predicates:
                path: "Path=/ttyd/{namespace}/{service_name}/**"
              filters:
                arg: "StripPrefix=3"
                name: "DynamicHostAdapter"
            httpclient:
              ssl:
                useInsecureTrustManager: true
              compression: true
              websocketMaxFramePayloadLength: "25165824"  # 24 * 1024 * 1024 24MB
  app:
    domain:
      auth:
        backendServerUrl: http://aipub-backend-gateway.aipub.svc.cluster.local:8080
        basicAuthUsername: testuser
        basicAuthPassword: asdasdasd
        verifyingSsl: false
      webterminal:
        workspaceControllerUrl: http://workspace-controller.aipub.svc.cluster.local:8080
    cookie:
      accessMaxAge: "1800"
      refreshMaxAge: "2592000"
      idMaxAge: "1800"
      domain: "" # ## HELM installer ##
    redirect:
      indexUrl: "" # ## HELM installer ##
      aipubUrl: "" # ## HELM installer ##
  web:
    client:
      maxInMemorySize: "20971520"   # 20MB
  cors:
    allowedOrigin: "" # ## HELM installer ##
  logging:
    level:
      orgSpringframeworkCloud: "" # ## HELM installer ##
      orgSpringframeworkWeb: "" # ## HELM installer ##
  management:
    tracing:
      enabled: true

agent:
  datadog: "false"
  javaToolOptions: "-javaagent:/opt/aipub/agents/dd-java-agent.jar"
  ddTraceAgentPort: "8126"
  ddService: "aipub-backend-adapter"
  ddEnv: "production"
  ddVersion: "1.0.0"
  host: "aipub-backend-datadog.aipub.svc.cluster.local"
  ddProfilingEnabled: "true"
  ddProfilingAllocationEnabled: "true"
