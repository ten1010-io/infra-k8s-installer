replicaCount: 1

image:
  repository: ghcr.io/ten1010-io/aipub-backend-batch
  pullPolicy: Always
  tag: "1.0.3"

imagePullSecrets:
  - name: ghcr-ten1010
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: "aipub-backend-batch"

podAnnotations:
  ad.datadoghq.com/aipub-backend-batch.logs: '[{"source": "java", "service": "aipub-backend-batch"}]'
podLabels: { }

podSecurityContext: { }

securityContext: { }

service:
  type: ClusterIP
  port: 8080

resources: { }

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes:
  - hostPath:
      path: /opt/aipub/certs
      type: Directory
    name: ca-certs
  - name: java-agents
    hostPath:
      path: /opt/aipub/agents
      type: Directory

volumeMounts:
  - mountPath: /certificates
    name: ca-certs
    readOnly: true
  - mountPath: /opt/aipub/agents
    name: java-agents

nodeSelector: { }

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

envFrom:
  configMapSuffix: envs
  secretSuffix: envs

applicationYaml:
  profiles:
    active: production
  spring:
    batch:
      jdbc:
        initializeSchema: never
    dataSource:
      batch:
        driverClassName: org.postgresql.Driver
        url: jdbc:postgresql://keycloak-postgresql.aipub.svc.cluster.local:5432/aipub
        username: aipub
        password: Password1@
        hikari:
          maximumPoolSize: 10
          minimumIdle: 5
    jpa:
      hibernate:
        ddlAuto: validate
      showSql: false
      generateDdl: false
      openInView: false
      properties:
        hibernate:
          formatSql: false
          defaultBatchFetchSize: 100
  app:
    gateway:
      backendUrl: http://aipub-backend-gateway.aipub.svc.cluster.local:8080
      username: testuser
      password: asdasdasd
    schedule:
      interval:
        createKeycloakJob: 10
        createHarborJob: 10
        createK8sJob: 10
        disableKeycloakJob: 123
        deleteHarborJob: 125
        deleteK8sJob: 127

agent:
  javaToolOptions: "-javaagent:/opt/aipub/agents/dd-java-agent.jar"
  ddTraceAgentPort: "8126"
  ddService: "aipub-backend-batch"
  ddEnv: "production"
  ddVersion: "1.0.0"
  host: "aipub-backend-datadog.aipub.svc.cluster.local"
  ddProfilingEnabled: "true"
  ddProfilingAllocationEnabled: "true"
