replicaCount: 1

image:
  repository: vnode2.pnode1.idc1.ten1010.io:8443/aipub-ops-4.0.0/lgd-backend-batch
  pullPolicy: Always
  tag: "0.0.0-SNAPSHOT"

imagePullSecrets:
  - name: harbor-java
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: "lgd-backend-batch"

podAnnotations: { }
podLabels: { }

podSecurityContext: { }

securityContext: { }

service:
  type: ClusterIP
  port: 8080

resources: { }

#livenessProbe:
#  httpGet:
#    path: /
#    port: http
#readinessProbe:
#  httpGet:
#    path: /
#    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes:
  - name: ca-certs
    hostPath:
      path: /opt/aipub/certs
      type: Directory
  - name: java-agents
    hostPath:
      path: /opt/aipub/agents
      type: Directory

volumeMounts:
  - mountPath: /certificates
    name: ca-certs
    readOnly: true
  - mountPath: /opt/aipub/agents
    name: java-agents

nodeSelector: { }

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

envFrom:
  configMapSuffix: envs
  secretSuffix: envs

applicationYaml:
  profiles:
    active: production
  spring:
    batch:
      jdbc:
        initializeSchema: never
    dataSource:
      driverClassName: org.postgresql.Driver
      url: jdbc:postgresql://keycloak-postgresql.aipub.svc.cluster.local:5432/lgd_eai
      username: aipub
      password: Password1@
      hikari:
        maximumPoolSize: 10
        minimumIdle: 5
    jpa:
      hibernate:
        ddlAuto: validate
      showSql: false
      generateDdl: false
      openInView: false
      properties:
        hibernate:
          formatSql: false
          defaultBatchFetchSize: 100
  app:
    gateway:
      backendUrl: "http://aipub-backend-gateway.aipub.svc.cluster.local:8080"
      username: "testuser"
      password: "asdasdasd"
    schedule:
      crontab:
        empCreateJob: 0 47 17 * * ?
      interval:
        eaiAipubJob: 10
        createKeycloakJob: 10
        createHarborJob: 10
        createK8sJob: 10
        disableKeycloakJob: 123
        deleteHarborJob: 125
        deleteK8sJob: 127
    aipubAdmin:
      list:
        admin1: ajskd123@lgdisplay.com
        admin2: jspark9608@lgdisplay.com
        admin3: hanshine@lgdpartner.com
        admin4: surimeom@lgdpartner.com

agent:
  javaToolOptions: "-javaagent:/opt/aipub/agents/dd-java-agent.jar"
  ddTraceAgentPort: "8126"
  ddService: "lgd-backend-batch"
  ddEnv: "production"
  ddVersion: "1.0.0"
  host: "aipub-backend-datadog.aipub.svc.cluster.local"
  ddProfilingEnabled: "true"
  ddProfilingAllocationEnabled: "true"
