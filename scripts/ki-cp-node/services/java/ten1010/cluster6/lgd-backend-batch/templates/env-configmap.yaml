apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-envs
  labels:
    {{- include "lgd-backend-batch.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.applicationYaml.profiles.active | quote }}

  SPRING_DATASOURCE_DRIVER_CLASS_NAME: {{ .Values.applicationYaml.spring.dataSource.driverClassName | quote }}
  SPRING_DATASOURCE_URL: {{ .Values.applicationYaml.spring.dataSource.url | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.applicationYaml.spring.dataSource.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.applicationYaml.spring.dataSource.password | quote }}

  SPRING_JPA_HIBERNATE_DDL_AUTO: {{ .Values.applicationYaml.spring.jpa.hibernate.ddlAuto | quote }}

  APP_GATEWAY_BACKEND_URL: {{ .Values.applicationYaml.app.gateway.backendUrl | quote }}
  APP_GATEWAY_USERNAME: {{ .Values.applicationYaml.app.gateway.username | quote }}
  APP_GATEWAY_PASSWORD: {{ .Values.applicationYaml.app.gateway.password | quote }}

  APP_AIPUB_ADMIN_LIST_0: {{ .Values.applicationYaml.app.aipubAdmin.list.admin1 | quote }}
  APP_AIPUB_ADMIN_LIST_1: {{ .Values.applicationYaml.app.aipubAdmin.list.admin2 | quote }}
  APP_AIPUB_ADMIN_LIST_2: {{ .Values.applicationYaml.app.aipubAdmin.list.admin3 | quote }}
  APP_AIPUB_ADMIN_LIST_3: {{ .Values.applicationYaml.app.aipubAdmin.list.admin4 | quote }}

  APP_SCHEDULE_CRONTAB_EMP_CREATE_JOB: {{ .Values.applicationYaml.app.schedule.crontab.empCreateJob | quote }}
  APP_SCHEDULE_INTERVAL_CREATE_HARBOR_JOB: {{ .Values.applicationYaml.app.schedule.interval.createHarborJob | quote }}
  APP_SCHEDULE_INTERVAL_CREATE_K8S_JOB: {{ .Values.applicationYaml.app.schedule.interval.createK8sJob | quote }}
  APP_SCHEDULE_INTERVAL_CREATE_KEYCLOAK_JOB: {{ .Values.applicationYaml.app.schedule.interval.createKeycloakJob | quote }}
  APP_SCHEDULE_INTERVAL_DELETE_HARBOR_JOB: {{ .Values.applicationYaml.app.schedule.interval.deleteHarborJob | quote }}
  APP_SCHEDULE_INTERVAL_DELETE_K8S_JOB: {{ .Values.applicationYaml.app.schedule.interval.deleteK8sJob | quote }}
  APP_SCHEDULE_INTERVAL_DISABLE_KEYCLOAK_JOB: {{ .Values.applicationYaml.app.schedule.interval.disableKeycloakJob | quote }}
  APP_SCHEDULE_INTERVAL_EAI_AIPUB_JOB: {{ .Values.applicationYaml.app.schedule.interval.eaiAipubJob | quote }}

  TZ: "Asia/Seoul"

  JAVA_TOOL_OPTIONS: {{ .Values.agent.javaToolOptions | quote }}
  DD_TRACE_AGENT_PORT: {{ .Values.agent.ddTraceAgentPort | quote }}
  DD_SERVICE: {{ .Values.agent.ddService | quote }}
  DD_ENV: {{ .Values.agent.ddEnv | quote }}
  DD_VERSION: {{ .Values.image.tag | quote }}
  DD_AGENT_HOST: {{ .Values.agent.host | quote }}
  DD_PROFILING_ENABLED: {{ .Values.agent.ddProfilingEnabled | quote }}
  DD_PROFILING_ALLOCATION_ENABLED: {{ .Values.agent.ddProfilingAllocationEnabled | quote }}
