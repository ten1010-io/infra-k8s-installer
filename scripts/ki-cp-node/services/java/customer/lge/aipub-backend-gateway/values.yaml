replicaCount: 1

image:
  repository: ghcr.io/ten1010-io/aipub-backend-gateway
  pullPolicy: IfNotPresent
  tag: "1.0.4"

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: ""

podAnnotations: { }
podLabels: { }

podSecurityContext: { }

securityContext: { }

service:
  type: ClusterIP
  port: 8080

resources: { }

livenessProbe:
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
  successThreshold: 1
  tcpSocket:
    port: 8080
  timeoutSeconds: 1
readinessProbe:
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
  successThreshold: 1
  tcpSocket:
    port: 8080
  timeoutSeconds: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes:
  - hostPath:
      path: /opt/aipub/certs
      type: Directory
    name: ca-certs

volumeMounts:
  - mountPath: /etc/ssl/certs
    name: ca-certs
    readOnly: true

nodeSelector: { }

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

envFrom:
  configMapSuffix: envs
  secretSuffix: envs

applicationYaml:
  grpc:
    client:
      backendApi:
        address: dns:///aipub-backend-api.aipub.svc.cluster.local:9090
      backendUsage:
        address: dns:///aipub-backend-usage.aipub.svc.cluster.local:9090
  spring:
    profiles:
      active: production
    web:
      resources:
        addMappings: "false"
  app:
    jwt:
      secretKey: ## LGE ##
    application:
      type: BACKEND_GATEWAY
      id: backend-gateway
    cookie:
      domain: ".aipub.lge.com"
    web:
      k8sProxy:
        k8sUri: https://10.96.0.1
      security:
        allowedOrigins_0: https://main.aipub.lge.com
        allowedOrigin: https://main.aipub.lge.com
        basicAuth:
          user:
            username: "testuser"
            password: "asdasdasd"
            role: "aipub-admin"
  logging:
    level:
      orgSpringframeworkWeb: info
