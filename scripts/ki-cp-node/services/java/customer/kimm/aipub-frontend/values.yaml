replicaCount: 1

image:
  repository: aipub-web
  pullPolicy: IfNotPresent
  tag: "1.3.4-hotfix.11"

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: ""

podAnnotations: { }
podLabels: { }

podSecurityContext: { }

securityContext: { }

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

resources: { }

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: { }

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

envFrom:
  configMapSuffix: envs
  secretSuffix: envs

applicationYaml:
  aipubVersion: "v4.1.0"
  aipubTitle: "AI Pub"
  aipubApiUrl: https://main.aipub.kimm.re.kr
  aipubBaseHost: aipub.kimm.re.kr
  aipubLogoutRedirectUrl: https://main.aipub.kimm.re.kr/welcome
  aipubBrand: "aipub"
  aipubUseMock: "false"
  aipubDocsUrl: https://main.aipub.kimm.re.kr/docs
  aipubHarborUrl: https://harbor.aipub.kimm.re.kr
  aipubMode: ops
  aipubUseSso: "false"
  aipubNodeUrl: https://main.aipub.kimm.re.kr/alloc
  aipubNoticeUrl: https://main.aipub.kimm.re.kr/notice
  aipubReportUrl: https://main.aipub.kimm.re.kr/report
  aipubKibanaUrl: https://main.aipub.kimm.re.kr/kibana
  aipubStreamlitUrl: https://main.aipub.kimm.re.kr/streamlit
  aipubSshPortMin: "12000"
  aipubSshPortMax: "12100"
  aipubVolumes: '[{"type":"nfs","value":"nfs"},{"type":"storageclass","value":"dynamic-prodata"}]'
  appPrefix: AIPUB_
  assetDir: /usr/share/nginx/html
