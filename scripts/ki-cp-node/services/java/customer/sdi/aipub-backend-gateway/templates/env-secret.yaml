apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-envs
  labels:
    {{- include "aipub-backend-gateway.labels" . | nindent 4 }}
stringData:
  APP_JWT_SECRET_KEY: {{ .Values.applicationYaml.app.jwt.secretKey | quote }}
  APP_JWT_KEYCLOAK_PUBLIC_KEY: {{ .Values.applicationYaml.app.jwt.keycloakPublicKey | quote }}
  APP_WEB_SECURITY_BASIC_AUTH_0_PASSWORD: {{ .Values.applicationYaml.app.web.security.basicAuth.user.password | quote }}
