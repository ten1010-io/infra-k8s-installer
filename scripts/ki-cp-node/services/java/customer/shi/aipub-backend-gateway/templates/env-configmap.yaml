apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-envs
  labels:
    {{- include "aipub-backend-gateway.labels" . | nindent 4 }}
data:
  GRPC_CLIENT_BACKEND_API_ADDRESS: {{ .Values.applicationYaml.grpc.client.backendApi.address | quote }}
  GRPC_CLIENT_BACKEND_USAGE_ADDRESS: {{ .Values.applicationYaml.grpc.client.backendApi.address | quote }}

  SPRING_PROFILES_ACTIVE: {{ .Values.applicationYaml.spring.profiles.active | quote }}
  SPRING_WEB_RESOURCES_ADD_MAPPINGS: {{ .Values.applicationYaml.spring.web.resources.addMappings | quote }}

  APP_APPLICATION_TYPE: {{ .Values.applicationYaml.app.application.type | quote }}
  APP_APPLICATION_ID: {{ .Values.applicationYaml.app.application.id | quote }}

  APP_COOKIE_DOMAIN: {{ .Values.applicationYaml.app.cookie.domain | quote }}

  APP_DOMAIN_KEYCLOAK_ISSUER_URI: {{ .Values.applicationYaml.app.domain.keycloak.issuerUri | quote }}

  APP_WEB_K8S_PROXY_K8S_URI: {{ .Values.applicationYaml.app.web.k8sProxy.k8sUri | quote }}

  APP_WEB_SECURITY_ALLOWED_ORIGINS_0: {{ .Values.applicationYaml.app.web.security.allowedOrigins_0 | quote }}
  APP_WEB_SECURITY_ALLOWED_ORIGIN: {{ .Values.applicationYaml.app.web.security.allowedOrigin | quote }}

  APP_WEB_SECURITY_BASIC_AUTH_0_USERNAME: {{  .Values.applicationYaml.app.web.security.basicAuth.user.username | quote }}
  APP_WEB_SECURITY_BASIC_AUTH_0_ROLE_0: {{ .Values.applicationYaml.app.web.security.basicAuth.user.role | quote }}

  TZ: "Asia/Seoul"

  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: {{ .Values.applicationYaml.logging.level.orgSpringframeworkWeb | quote }}
