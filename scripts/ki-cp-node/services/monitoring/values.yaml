              summary: "High RAM usage detected"
              description: |
                ({{ $labels.nodename }}) 워커 노드의 메모리 사용률이 80%입니다.
                사용률이 95% 초과 시 AIPub 사용이 불가할 수 있습니다.
                메모리 리소스를 확보해주세요 
          - alert: HighRAMUsageWorker
            expr: |
               (
                 (
                   1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                 ) * 100
                 unless on(nodename) 
                 label_replace(
                   kube_node_role{role="control-plane"},
                   "nodename",
                   "$1",
                   "node",
                   "(.*)"
                 )
               ) >= 90
            for: 1m
            labels:
              severity: critical
              target: aipub
            annotations:
              summary: "High RAM usage detected"
              description: |
                ({{ $labels.nodename }}) 워커 노드의 메모리 사용률이 90%입니다.
                사용률이 95% 초과 시 AIPub 사용이 불가할 수 있습니다.
                메모리 리소스를 확보해주세요              
          - alert: HighStorageUsageWorker
            expr: |
               (
                 (
                   1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
                 ) * 100
                 unless on(nodename) 
                 label_replace(
                   kube_node_role{role="control-plane"},
                   "nodename",
                   "$1",
                   "node",
                   "(.*)"
                 )
               ) >= 60
            for: 1m
            labels:
              severity: warning
              target: aipub
            annotations:
              summary: "High Storage usage detected"
              description: |
                ({{ $labels.nodename }}) 워커 노드의 스토리지 사용률이 60%입니다.
                사용률이 80% 초과 시 AIPub 사용이 불가할 수 있습니다.
                스토리지 리소스를 확보해주세요 
          - alert: HighStorageUsageWorker
            expr: |
               (
                 (
                   1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
                 ) * 100
                 unless on(nodename) 
                 label_replace(
                   kube_node_role{role="control-plane"},
                   "nodename",
                   "$1",
                   "node",
                   "(.*)"
                 )
               ) >= 70
            for: 1m
            labels:
              severity: critical
              target: aipub
            annotations:
              summary: "High Storage usage detected"
              description: |
                ({{ $labels.nodename }}) 워커 노드의 스토리지 사용률이 70%입니다.
                사용률이 80% 초과 시 AIPub 사용이 불가할 수 있습니다.
                스토리지 리소스를 확보해주세요
        #### Prometheus Rules for fractional GPU Allocation 
        - name: gpu.resource.rules
          rules:
          # Regular GPU
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_mig_.*",
                resource!~".*_block_.*"
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1)
            labels:
              gpu_type: "gpu"
     
          # A30 MIG 1g-4g
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource=~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_1g_.*",
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (1/4)
            labels:
              gpu_type: "mig_a30_1g"
     
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource=~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_2g_.*",
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (2/4)
            labels:
              gpu_type: "mig_a30_2g"
     
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource=~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_3g_.*",
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (3/4)
            labels:
              gpu_type: "mig_a30_3g"
     
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource=~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_4g_.*"
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (4/4)
            labels:
              gpu_type: "mig_a30_4g"
     
          # Regular MIG 1g-7g
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_1g_.*"
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (1/7)
            labels:
              gpu_type: "mig_1g"
     
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_2g_.*"
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (2/7)
            labels:
              gpu_type: "mig_2g"
     
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_3g_.*"
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (3/7)
            labels:
              gpu_type: "mig_3g"
     
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_4g_.*"
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (4/7)
            labels:
              gpu_type: "mig_4g"
     
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_5g_.*"
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (5/7)
            labels:
              gpu_type: "mig_5g"
     
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_6g_.*"
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (6/7)
            labels:
              gpu_type: "mig_6g"
     
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_7g_.*"
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (7/7)
            labels:
              gpu_type: "mig_7g"
     
          # Block resources
          - record: gpu:resource:requests
            expr: |
              kube_pod_container_resource_requests{
                resource=~"ten1010_io_block_.*|ten1010_io_gpu_block_.*"
              } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1) * (1/100)
            labels:
              gpu_type: "block"
  
          # Regular GPU
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_mig_.*",
                resource!~".*_block_.*"
              }
            labels:
              gpu_type: "gpu"
     
          # A30 MIG 1g-4g
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource=~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_1g_.*"
              } * (1/4)
            labels:
              gpu_type: "mig_a30_1g"
     
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource=~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_2g_.*"
              } * (2/4)
            labels:
              gpu_type: "mig_a30_2g"
     
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource=~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_3g_.*"
              } * (3/4)
            labels:
              gpu_type: "mig_a30_3g"
     
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource=~".*_nvidia_a30_.*",
                resource=~".*_a30_.*",
                resource=~".*_4g_.*"
              } * (4/4)
            labels:
              gpu_type: "mig_a30_4g"
     
          # Regular MIG 1g-7g
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_1g_.*"
              } * (1/7)
            labels:
              gpu_type: "mig_1g"
     
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_2g_.*"
              } * (2/7)
            labels:
              gpu_type: "mig_2g"
     
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_3g_.*"
              } * (3/7)
            labels:
              gpu_type: "mig_3g"
     
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_4g_.*"
              } * (4/7)
            labels:
              gpu_type: "mig_4g"
     
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_5g_.*"
              } * (5/7)
            labels:
              gpu_type: "mig_5g"
     
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_6g_.*"
              } * (6/7)
            labels:
              gpu_type: "mig_6g"
     
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_gpu_.*",
                resource!~".*_nvidia_a30_.*",
                resource=~".*_mig_.*",
                resource=~".*_7g_.*"
              } * (7/7)
            labels:
              gpu_type: "mig_7g"
     
          # Block resources
          - record: gpu:resource:node
            expr: |
              kube_node_status_allocatable{
                resource=~"ten1010_io_block_.*|ten1010_io_gpu_block_.*"
              } * (1/100)
            labels:
              gpu_type: "block"
          - expr: DCGM_FI_DEV_GPU_TEMP{}
            record: gpu:resource:gpu_temp
          - expr: DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{}
            record: gpu:resource:tensor_core
          - expr: DCGM_FI_PROF_DRAM_ACTIVE{}
            record: gpu:resource:dram_active
          - expr: DCGM_FI_DEV_POWER_USAGE{}
            record: gpu:resource:power
          - expr: DCGM_FI_PROF_SM_ACTIVE{}
            record: gpu:resource:sm_active
          - expr: DCGM_FI_DEV_GPU_UTIL{}
            record: gpu:resource:util
  defaultDashboards:
    enabled: false
  vmsingle:
    # vmstack으로 vmsingle을 프로비저닝 하지 않음.
    enabled: false
  alertmanager:
    enabled: false
    name: "vmstack-alertmanager"
    spec:
      replicaCount: *cp_node_count
      resources:
        limits:
          cpu: 200m
          memory: 200Mi
        requests:
          cpu: 200m
          memory: 200Mi
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      image:
        registry: *image_registry
        # ten1010.io registry 주소가 있는 이미지는 폐쇄망 환경에서 빌드할떄 활용하는 이미지이므로, 외부 접근이 허용된 경우에는 images 를 주석처리한다.
        repository: *alert_manager_image_repository
        tag: *alert_manager_image_tag
        sha: *alert_manager_image_sha
    config:
      inhibit_rules:
        - source_matchers:
            - 'severity = critical'
          target_matchers:
            - 'severity =~ warning|info'
          equal:
            - 'alertname'
            - 'nodename'
        - source_matchers:
            - 'severity = warning'
          target_matchers:
            - 'severity = info'
          equal:
            - 'alertname'
            - 'nodename'
      route:
        group_by: ['alertname', 'severity', 'target', 'namespace', 'nodename', 'node']
        group_wait: 30s
        group_interval: 1m
        repeat_interval: 720h # prometheus의 retention period와 동일하게 설정.
        receiver: watchdog #이름을 NULL에서 watchdog로 변경
        routes:
        - receiver: watchdog #이름을 NULL에서 watchdog로 변경
          matchers:
            - alertname = "Watchdog"
        - receiver: 'custom-webhook'
          matchers:
            - target = "aipub"
            - alertname !~ "InfoInhibitor"   
      receivers:
      #이름을 NULL에서 watchdog로 변경
      - name: watchdog
      - name: 'custom-webhook'
        webhook_configs:
        #- url: 'http://192.168.2.2:23456/webhook' 
        - url: "http://prom-infra-alerter.aipub-efk.svc.cluster.local:80/webhook"
          send_resolved: false
      templates:
      - '/etc/alertmanager/config/*.tmpl'
  vmalert:
    enabled: false
    name: "vmstack-vmalert"
    remoteWriteVMAgent: true
    spec:
      image:
        registry: *image_registry
        repository: *vmalert_image_repository
        tag: *vmalert_image_tag
        pullPolicy: *vmalert_image_pull_policy
      remoteRead:
        url: *metrics_server_url_with_port
      remoteWrite:
        url: *metrics_server_write_url
      datasource:
        url: *metrics_server_url_with_port
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      notifiers:
        - url: "http://vmalertmanager-vmstack-alertmanager.aipub-promstack:9093/"
  vmauth:
    enabled: false
    name: "vmstack-vmauth"
    spec:
      image:
        registry: *image_registry
        repository: *vmauth_image_repository
        tag: *vmauth_image_tag
        pullPolicy: *vmauth_image_pull_policy
      port: "8427"
      disableSelfServiceScrape: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      unauthorizedUserAccessSpec:
        # -- Flag, that allows to disable default VMAuth unauthorized user access config
        disabled: false
        discover_backend_ips: true
        url_map:
          - src_paths:
              - /vmui/.*
              - /graph/.*
              - /prometheus/.*
              - /api/v1/.*
              - /prometheus/api/v1/.*
            url_prefix:
              *vm_stack_vmsingle_urls_with_port
        load_balancing_policy: "least_loaded"
  vmagent:
    enabled: false
    name: "vmstack-vmagent"
    additionalRemoteWrites:
      *vm_stack_vmsingle_objects
    spec:
      image:
        registry: *image_registry
        repository: *vmagent_image_repository
        tag: *vmagent_image_tag
        pullPolicy: *vmagent_image_pull_policy
      scrapeInterval: *common_exporter_interval
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      resources:
        limits:
          cpu: 700m
          memory: 512Mi
        requests:
          cpu: 700m
          memory: 512Mi
      disableSelfServiceScrape: true
      inlineScrapeConfig: |
        - job_name: 'linkerd-proxy'
          kubernetes_sd_configs:
          - role: pod
          relabel_configs:
          - source_labels:
            - __meta_kubernetes_pod_container_name
            - __meta_kubernetes_pod_container_port_name
            action: keep
            regex: ^linkerd-proxy;linkerd-admin$
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_linkerd_io_proxy_job]
            action: replace
            target_label: k8s_job
          - action: labeldrop
            regex: __meta_kubernetes_pod_label_linkerd_io_proxy_job
          - action: labelmap
            regex: __meta_kubernetes_pod_label_linkerd_io_proxy_(.+)
          - action: labeldrop
            regex: __meta_kubernetes_pod_label_linkerd_io_proxy_(.+)
          - action: labelmap
            regex: __meta_kubernetes_pod_label_linkerd_io_(.+)
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
            replacement: __tmp_pod_label_$1
          - action: labelmap
            regex: __tmp_pod_label_linkerd_io_(.+)
            replacement:  __tmp_pod_label_$1
          - action: labeldrop
            regex: __tmp_pod_label_linkerd_io_(.+)
          - action: labelmap
            regex: __tmp_pod_label_(.+)
              
        - job_name: 'linkerd'
          kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['linkerd-viz']
          relabel_configs:
          - source_labels:
            - __meta_kubernetes_pod_container_name
            action: keep
            regex: ^prometheus$
          honor_labels: true
          metrics_path: '/federate'
          params:
            'match[]':
              - '{job="linkerd-proxy"}'
              - '{job="linkerd-controller"}'
      extraArgs:
        promscrape.suppressScrapeErrors: "true"
  grafana:
    enabled: false

  prometheus-node-exporter:
    enabled: false
    tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    image:
      registry: *image_registry
      repository: *node_exporter_image_repository
      # Overrides the image tag whose default is {{ printf "v%s" .Chart.AppVersion }}
      tag: *node_exporter_image_tag
      pullPolicy: *node_exporter_image_pull_policy
      digest: *node_exporter_image_digest
    livenessProbe:
      failureThreshold: 3
      httpGet:
        httpHeaders: []
        scheme: http
      initialDelaySeconds: 0
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 10
    
    ## Readiness probe
    ##
    readinessProbe:
      failureThreshold: 3
      httpGet:
        httpHeaders: []
        scheme: http
      initialDelaySeconds: 0
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 10
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 200m
        memory: 128Mi
    vmScrape:
      enabled: true
      spec:
        endpoints:
        - port: metrics
          # monitor.relabelings 이식 위치(스크레이프 전 타겟 relabel)
          relabelConfigs:
            # grafana 대시보드에서 노드 이름을 instance로 보이게(주의: 기존대로 유지)
            - action: replace
              source_labels: [__meta_kubernetes_pod_node_name]
              target_label: instance
            # nodename 라벨 추가 (instance 치환으로 생기는 부작용 회피용)
            - action: replace
              source_labels: [__meta_kubernetes_pod_node_name]
              target_label: nodename
          metricRelabelConfigs:
            - action: drop
              source_labels: [mountpoint]
              regex: "/var/lib/kubelet/pods.+"
    prometheus:
      monitor:
        enabled: false
  kube-state-metrics:
    enabled: false
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
      #When Specific node needs to be selected, add following line
      #kubernetes.io/hostname: *cp1
    tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    image:
      registry: *image_registry
      repository: *kube_state_metrics_image_repository
      # If unset use v + .Charts.appVersion
      tag: *kube_state_metrics_image_tag
      sha: *kube_state_metrics_image_sha
      pullPolicy: *kube_state_metrics_image_pull_policy
    prometheusScrape: true
    metricAnnotationsAllowList:
      - nodes=[*]
    metricLabelsAllowlist:
      - namespaces=[*]
      - services=[*]
      - pods=[*]
      - deployments=[*]
      - horizontalpodautoscalers=[*]
      - nodes=[*]
    resources:
      limits:
        cpu: 200m
        memory: 200Mi
      requests:
        cpu: 200m
        memory: 200Mi      
    prometheus:
      monitor:
        interval: *common_exporter_interval
        additionalLabels:
          <<: *common_labels
  kubelet:
    enabled: false
  kubeApiServer:
    enabled: false
