dcgm-exporter:
  enabled: false
  resources:
    limits:
      cpu: 1
      memory: 1536Mi
    requests:
      cpu: 1
      memory: 1536Mi
  image:
    registry: *image_registry
    repository: *dcgm_exporter_image_repository
    pullPolicy: *dcgm_exporter_image_pull_policy
    # Image tag defaults to AppVersion, but you can use the tag key
    # for the image tag, e.g:
    tag: *dcgm_exporter_image_tag

  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists

  extraEnv:
    - name: DCGM_EXPORTER_INTERVAL
      value: *common_exporter_interval_milliseconds

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-type.coaster.ten1010.io/gpu
                operator: Exists

  # Liveness probe configuration
  # Checks /health endpoint and optionally verifies DCGM_FI_PROF_SM_ACTIVE metric exists
  # - requireSmActive: false - SM_ACTIVE metric is optional, only /health is required
  #   Use this when nodes with and without SM_ACTIVE support are mixed in the cluster
  # - requireSmActive: true (default) - SM_ACTIVE metric is required, probe fails if metric is not found
  #   Use this when all nodes support SM_ACTIVE metric
  livenessProbe:
    requireSmActive: true  # Set to false if SM_ACTIVE metric is optional
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  serviceMonitor:
    apiVersion: "monitoring.coreos.com/v1"
    enabled: true
    interval: *common_exporter_interval
    honorLabels: false
    additionalLabels:
      <<: *common_labels

