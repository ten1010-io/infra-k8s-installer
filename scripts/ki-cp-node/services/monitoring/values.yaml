aipub-monitoring:
  enabled: false
  replicaCount: 1
  basePath: *aipub_monitoring_base_path
  image:
    registry: *image_registry
    repository: *aipub_monitoring_image_repository
    tag: *aipub_monitoring_image_tag
    imagePullPolicy: *aipub_monitoring_image_pull_policy
  initContainer:
    image:
      registry: *image_registry
      repository: *busybox_image_repository
      tag: *busybox_image_tag
      pullPolicy: *busybox_image_pull_policy

  service:
    type: ClusterIP
    port: 8501

  # 리소스 설정
  resources:
    <<: *aipub_monitoring_resources

  # 노드 스케줄링 설정
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
    #kubernetes.io/hostname: *cp1
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      effect: "NoSchedule"
      operator: "Exists"

  affinity:
  #  nodeAffinity:
  #    requiredDuringSchedulingIgnoredDuringExecution:
  #      nodeSelectorTerms:
  #      - matchExpressions:
  #        - key: kubernetes.io/hostname
  #          operator: In
  #          values:
  #          - *cp1
  #          - *cp2
  #          - *cp3    

  # 환경 변수 설정
  env:
    # 타임존
    TIME_ZONE: "Asia/Seoul"
    # 컨테이너 로컬 타임존 (datetime.fromtimestamp 등 기본 로컬 시간에 영향)
    TZ: "Asia/Seoul"
    # 테스트 모드 활성화 (true/false)
    TEST_MODE: "false"
    # 인증 방식 (none, keycloak, cookie)
    AUTH_TYPE: "cookie"
    # 메트릭스 백엔드 서비스 이름
    METRICS_SERVICE_NAME: "vmauth-vmstack-vmauth"
    # 메트릭스 백엔드 네임스페이스
    METRICS_NAMESPACE: "aipub-promstack"
    # 메트릭스 백엔드 포트
    METRICS_PORT: "8427"
    # CSV 다운로드 기능 활성화 (true/false)
    CSV_DOWNLOAD_ENABLED: "true"
    # IPMI 전력 센서 이름 (환경마다 다를 수 있음)
    # TEN: PWR_SYSTEM, LGD: Pwr Consumption, SDI: Power Meter, Samsung Display: Sys Power
    IPMI_POWER_SENSOR_NAME: "PWR_SYSTEM|Pwr Consumption|Power Meter|Sys Power"
    # 차트 최소 STEP
    MIN_STEP_SECONDS: *common_exporter_interval_seconds

  # Ingress 및 TLS 설정
  ingress:
    ingressClassName: "lb1"
    host: "aipub-monitoring.cluster3.idc1.ten1010.io"
    # caCertificate는 auth.enabled=true 일 때 필요함
    caCertificate: |
      -----BEGIN CERTIFICATE-----
      -----END CERTIFICATE-----
    tlsCertificate: |
      -----BEGIN CERTIFICATE-----
      -----END CERTIFICATE-----
    tlsPrivateKey: |
      -----BEGIN PRIVATE KEY-----
      -----END PRIVATE KEY-----

  # Streamlit 인증 설정
  auth:
    enabled: false
    # cookieSecret을 설정하지 않으면 자동으로 랜덤 값 생성됨
    # cookieSecret: "custom-secret-here"
    keycloak:
      clientId: ""
      clientSecret: ""
      url: ""

