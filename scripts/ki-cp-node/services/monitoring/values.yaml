# =============================================================================
# Storage Strategy — 설치 시 이 블록만 수정하세요
# =============================================================================
#
# type: 전체 컴포넌트에 적용되는 스토리지 방식
#   "dynamic" - StorageClass 기반 자동 프로비저닝
#   "static"  - 직접 PV를 생성 (local 또는 nfs)
#
# dynamic.storageClassName: dynamic 방식 사용 시 StorageClass 이름
#
# static.type: static 방식 사용 시 볼륨 종류
#   "local" - 노드 로컬 디스크
#   "nfs"   - NFS 서버
#
# static.nfs.server: nfs 방식 사용 시 NFS 서버 주소
#
# =============================================================================
# Cluster Nodes — 설치 시 이 블록만 수정하세요
# =============================================================================
#
# static+local 스토리지 사용 시 각 PV의 nodeAffinity에 적용됩니다.
# cp1부터 순서대로 컴포넌트 배열 항목과 1:1 매칭됩니다.
#
_nodes:
  - &cp1 "control.plane.nodename.1"
  - &cp2 "control.plane.nodename.2"
  - &cp3 "control.plane.nodename.3"

# =============================================================================
# Scale — 설치 시 이 블록만 수정하세요
# =============================================================================
#
# cpNodeCount             : cp 노드 수. _nodes 배열 길이와 일치해야 합니다.
#                           elasticsearch / alertmanager / linkerd에 공통 적용됩니다.
# victoriaMetricsReleaseCount: vmsingle a/b 인스턴스 수. HA 시 2, 단일 시 1.
#                             static+local일 때 local 배열 항목 수와 일치해야 합니다.
#
_scale:
  cpNodeCount: &cp_node_count 3
  victoriaMetricsReleaseCount: &victoria_metrics_release_count 2

_storageType: &_storage_type "dynamic"            # "static" 또는 "dynamic"
_storageStaticType: &_storage_static_type "local" # "local" 또는 "nfs" (static 시에만 사용)
_storageClassName: &_storage_class_name "ontap-nas"
_nfsServer: &_nfs_server "nfs.example.com"


# =============================================================================
# Monitoring Infrastructure Values
# =============================================================================
imageRegistry: &image_registry "registry.ten1010.io:8443/aipub-4.5.0"
# imageRegistry: &image_registry "ki-cp.ki.local:5001/aipub-4.5.0"

infra:
  aipub_monitoring_tool_version: &aipub_monitoring_tool_version "v0.1.4"
  
  aipub:
    namespace: &aipub_namespace "aipub"

  linkerd:
    namespace: "aipub-linkerd"
    controllerReplicas: *cp_node_count  # Linkerd control plane 레플리카 수 (컨트롤 플레인 노드 개수에 맞게 조정)

  efkStack:
    namespace: &efk_namespace "aipub-efk"

    elasticsearch:
      replicas: *cp_node_count
      minimumMasterNodes: &elasticsearch_minimum_master_nodes 2
      roleName: "aipub_role"
      logRetention: &elasticsearch_log_retention_days 180d  # Log retention period for kube-log-* and kube-event-* indices
      storageProvisioning:
        size: &elasticsearch_storage_size "3Ti"
        type: *_storage_type            # Options: "static" or "dynamic"
        dynamic:
          storageClassName: *_storage_class_name
        static:
          type: *_storage_static_type  # Options: "local" or "nfs"
          local:
            - path: "/aipub/pv/elasticsearch/es_data"
              nodeSelector:
                kubernetes.io/hostname: *cp1
            - path: "/aipub/pv/elasticsearch/es_data"
              nodeSelector:
                kubernetes.io/hostname: *cp2
            - path: "/aipub/pv/elasticsearch/es_data"
              nodeSelector:
                kubernetes.io/hostname: *cp3
          nfs:
            - server: *_nfs_server
              export: "/exports/aipub/elasticsearch"
              subPath: "/es_data1"
            - server: *_nfs_server
              export: "/exports/aipub/elasticsearch"
              subPath: "/es_data2"
            - server: *_nfs_server
              export: "/exports/aipub/elasticsearch"
              subPath: "/es_data3"
      clusterHealthCheckParams: &elasticsearch_cluster_health_check_params "wait_for_status=yellow&timeout=10s"

    kibana:
      auth:
        method: sso-gateway  # Options: "oidc" or "sso-gateway"
        ssoGateway:
          # [! caution] "basePath" must be removed if the auth method is "oidc".
          basePath: &kibana_base_path "/kibana"
          # [! caution] "healthCheckPath" must be removed if the auth method is "oidc".
          healthCheckPath: &kibana_health_check_path "/kibana/api/status"
        oidc:
          admin: &kibana_admin_domain "kibana-admin.cluster3.idc1.ten1010.io"
          user: &kibana_user_domain "kibana-user.cluster3.idc1.ten1010.io"
      # "server.basePath", "server.rewriteBasePath" are used for the sso-gateway auth method only.
      # "server.basePath", "server.rewriteBasePath" must be removed if the auth method is "oidc".
      kibanaConfig: &kibana_config
        kibana.yml: |
          server.basePath: /kibana
          server.rewriteBasePath: true
          server.ssl.enabled: true
          server.ssl.certificate: /usr/share/kibana/config/certs/tls.crt
          server.ssl.key: /usr/share/kibana/config/certs/tls.key
          xpack.security.sameSiteCookies: "None"
          xpack.security.authc.providers:
            basic.basic1:
              order: 0
            anonymous.anonymous1:
              order: 1
              credentials:
                username: "aipub"
                password: "aipub1@"

  kubePrometheusStack:
    commonLabels: &common_labels
      aipub.prometheus/select: "true"
  victoriaMetricsStack:
    namespace: &metrics_namespace "aipub-promstack"
    fullnameOverride: &metrics_fullname_override "aipub-promstack"
    alertManager:
      replicas: *cp_node_count  #alertmanger support HA modes when replicas is greater than 1
    storageProvisioning:
      type: *_storage_type            # Options: "static" or "dynamic"
      accessMode: &metrics_storage_access_mode "ReadWriteMany"
      dynamic:
        storageClassName: *_storage_class_name
      static:
        type: *_storage_static_type  # Options: "local" or "nfs"
        local:
          # Add a number of items equal to the replicas count
          - path: "/aipub/pv/promstack/vm_data1"
            nodeSelector:
              kubernetes.io/hostname: *cp1
          - path: "/aipub/pv/promstack/vm_data2"
            nodeSelector:
              kubernetes.io/hostname: *cp2
        nfs:
          # Add a number of items equal to the replicas count
          - server: *_nfs_server
            export: "/exports/aipub/promstack"
            subPath: "vm_data1"
          - server: *_nfs_server
            export: "/exports/aipub/promstack"
            subPath: "vm_data2"
    # Common scrape/collection intervals for exporters and collectors.
    # node-info-exporter is managed separately below.
    commonExporterIntervalPrometheus: &common_exporter_interval 15s
    commonExporterIntervalSeconds: &common_exporter_interval_seconds 15
    commonExporterIntervalMilliseconds: &common_exporter_interval_milliseconds "15000"
    nodeInfoExporterScrapeInterval: &node_info_exporter_scrape_interval 300s
    vmsingle:
      storageSize: &metrics_storage_size "1Ti"
      retentionPeriod: &metrics_retention_period "180d"
      replicaCount: &metrics_server_replicas 1
      releaseCount: *victoria_metrics_release_count  # Number of vmsingle releases installed (a/b)
      createClaims: false  # Pre-create PVCs bound to PVs for each release
      existingClaimPrefix: "aipub-vmstack-vmsingle-pvc"
      port: &metrics_server_port "8428"
    endpoints:
      metricsServerUrl: &metrics_server_url "http://vmauth-vmstack-vmauth.aipub-promstack.svc"
      metricsServerUrlWithPort: &metrics_server_url_with_port "http://vmauth-vmstack-vmauth.aipub-promstack.svc:8427"
      metricsServerWriteUrl: &metrics_server_write_url "http://vmagent-vmstack-vmagent.aipub-promstack.svc:8429/api/v1/write"
      metricsServiceName: &metrics_service_name "vmauth-vmstack-vmauth"
      metricsServicePort: &metrics_service_port "8427"
      vmsingleUrlsWithPort: &vm_stack_vmsingle_urls_with_port
        - "http://victoria-metrics-single-a-server.aipub-promstack.svc:8428"
        - "http://victoria-metrics-single-b-server.aipub-promstack.svc:8428"
      vmsingleObjects: &vm_stack_vmsingle_objects
        - url: "http://victoria-metrics-single-a-server.aipub-promstack.svc:8428/api/v1/write"
        - url: "http://victoria-metrics-single-b-server.aipub-promstack.svc:8428/api/v1/write"

  exporters:
    nodeInfoExporter:
      enabled: false
      configMap:
        name: mig-supported-gpus
        migSupportedGpus: &node_info_exporter_configMap_migSupportedGpus
          GB200:
            max_number_of_instances: 7
          B200:
            max_number_of_instances: 7
          H200:
            max_number_of_instances: 7
          H100:
            max_number_of_instances: 7
          A100:
            max_number_of_instances: 7
          A30:
            max_number_of_instances: 4
    aipubCrdExporter:
      enabled: false

# =============================================================================
# Monitoring Applications Values
# =============================================================================
apps:
  aipubNoticeBoardApi:
    replicas: &aipub_notice_board_api_replicas 1
    affinity: &aipub_notice_board_api_affinity
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
    storageProvisioning:
      size: &aipub_notice_board_api_storage_size "20Gi"
      type: *_storage_type  # Options: "static" or "dynamic"
      accessMode: &aipub_notice_board_api_storage_access_mode "ReadWriteMany"  # ReadWriteOnce or ReadWriteMany
      static:
        type: *_storage_static_type  # Options: "local" or "nfs"
        local: &aipub_notice_board_api_storage_local
          path: "/aipub/pv/aipub-notice-board-api/staticfiles"  # host path in the node
          nodeSelector:
            - kubernetes.io/hostname: *cp1
        nfs: &aipub_notice_board_api_storage_nfs
          server: *_nfs_server
          export: "/exports/aipub/aipub-notice-board-api"
          subPath: "staticfiles1"
      dynamic:
        storageClassName: *_storage_class_name

  aipubClusterOverviewApi:
    replicas: &aipub_cluster_overview_api_replicas 1
    service:
      port: &aipub_cluster_overview_api_service_port 8008
      targetPort: 8000
    affinity: &aipub_cluster_overview_api_affinity
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists

  aipubReport:
    ingress:
      enabled: &aipub_report_ingress_enabled false
      className: &aipub_report_ingress_class_name "lb1"
      host: &aipub_report_ingress_host "report.cluster5.idc1.ten1010.io"
    storageProvisioning:
      size: &aipub_report_storage_size "5Gi"
      type: *_storage_type  # Options: "static" or "dynamic"
      accessMode: &aipub_report_persistence_access_mode "ReadWriteOnce"  # ReadWriteOnce or ReadWriteMany
      existingClaim: &aipub_report_existing_claim "aipub-report-cache"
      dynamic:
        storageClassName: *_storage_class_name
      static:
        type: *_storage_static_type  # Options: "local" or "nfs"
        local: &aipub_report_storage_local
          path: "/aipub/pv/aipub-report/cache"  # host path in the node
          nodeSelector:
            - kubernetes.io/hostname: *cp1
        nfs: &aipub_report_storage_nfs
          server: *_nfs_server
          export: "/exports/aipub/aipub-report"
          subPath: "cache1"

  aipubMonitoring:
    basePath: &aipub_monitoring_base_path "/streamlit"
    resources: &aipub_monitoring_resources
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 2Gi

keycloak:
  enabled: false

