    crds:
      plain: true
      cleanup:
        enabled: false
    serviceMonitor:
      enabled: true
    logLevel: error
  defaultRules:
    create: false
  additionalVictoriaMetricsMap:
    aipub-rule:
      groups:
        - name: scheduler
          rules:
          - alert: scheduleStop1h
            expr: |
               kube_deployment_spec_replicas{namespace="coaster", deployment="scheduler"} == 0
            for: 1h
            labels:
              severity: info
              target: aipub
            annotations:
              summary: "schedule is stopped for 1h"
              description: |
                스케줄러 작동이 중지된지 1시간이 경과되었습니다.
                스케줄러 작동을 재개해야 리소스 할당과 워크로드 생성이 가능합니다.
        - name: aipub-master
          rules:
          - alert: MasterFault
            expr: |
               (
                 kube_node_role{role="control-plane"}* on(node) group_right()
                 sum by (node) (kube_node_status_condition{condition="Ready", status=~"false|unknown"})
               ) >= 1
            for: 1m
            labels:
              severity: critical
              target: aipub
            annotations:
              summary: "Master is dead"
              description: |
                ({{ $labels.node }}) 마스터노드에 장애가 발생하였습니다. 
          - alert: HighCPUUsageMaster
            expr: |
               (
                 label_replace(
                   kube_node_role{role="control-plane"},
                   "nodename",
                   "$1",
                   "node",
                   "(.*)"
                 ) * on(nodename) group_right()
                 (
                   1 - avg by(nodename) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
                 ) * 100
                ) >= 80
            for: 1m
            labels:
              severity: warning
              target: aipub
            annotations:
              summary: "High CPU usage detected"
              description: |
                ({{ $labels.nodename }}) 마스터 노드의 CPU 사용률이 80%입니다.
                사용률이 95% 초과 시 AIPub 사용이 불가할 수 있습니다.
                CPU 리소스를 확보해주세요 
