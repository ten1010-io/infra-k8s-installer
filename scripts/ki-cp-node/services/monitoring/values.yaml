# =============================================================================
# Sub-chart value mappings
# =============================================================================
elasticsearch:
  enabled: false
  clusterName: "elasticsearch"
  nodeGroup: "master"
  nameOverride: ""
  fullnameOverride: ""
  imageRegistry: *image_registry
  image: *elasticsearch_image
  imageTag: *elasticsearch_image_tag
  imagePullPolicy: "IfNotPresent"
  replicas: *cp_node_count
  minimumMasterNodes: *elasticsearch_minimum_master_nodes
  secret:
    password: ""  # generated randomly if not defined
  volumeClaimTemplate:
    accessModes: ["ReadWriteOnce"]
    storageClassName: *_storage_class_name
    resources:
      requests:
        storage: *elasticsearch_storage_size
  clusterHealthCheckParams: *elasticsearch_cluster_health_check_params
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 10
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 10
  tests:
    enabled: true
  # DESCRIPTION
  #   if you want to use a persistent volume claim for the backup, uncomment the following lines
  # USAGE
  #   1. create a persistent volume claim
  #   2. update the values.yaml file
  #   3. run the install.sh script
  #   4. check if exists /backup directory
  #   5. if exists, create a repository and snapshot
  #   6. uninstall the elasticsearch
  #   7. install the elasticsearch again
  #   8. check if the backup is working
  # extraVolumes:
  #   - name: backup
  #     persistentVolumeClaim:
  #       claimName: es-backup-pvc
  # extraVolumeMounts:
  #   - name: backup
  #     mountPath: /backup
  # extraEnvs:
  #   - name: path.repo
  #     value: "/backup"

kibana:
  enabled: false
  imageRegistry: *image_registry
  image: *kibana_image
  imageTag: *kibana_image_tag
  imagePullPolicy: "IfNotPresent"
  protocol: "https"
  healthCheckPath: *kibana_health_check_path
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  # affinity:
  #   <<: *kibana_affinity
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: node-role.kubernetes.io/control-plane
