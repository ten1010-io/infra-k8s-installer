
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aipub-report
  namespace: {{ include "chart.Namespace" . }}
spec:
  ingressClassName: {{.Values.ingress.className}}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aipub-report
            port:
              number: 8000
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: aipub-report
{{- end }}