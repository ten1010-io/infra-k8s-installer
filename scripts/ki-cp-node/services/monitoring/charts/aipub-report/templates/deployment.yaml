apiVersion: apps/v1
kind: Deployment
metadata:
  name: aipub-report
  namespace: {{ include "chart.Namespace" . }}
  labels:
    app: aipub-report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aipub-report
  template:
    metadata:
      labels:
        app: aipub-report
    spec:
      containers:
        - name: aipub-report
          image: "{{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          env:
            - name: LOG_LEVEL
              value: "{{ .Values.logLevel }}"
            - name: PROMETHEUS_ENDPOINT
              value: "{{ .Values.prometheusEndpoint }}"
            - name: CACHE_RETENTION_PERIOD
              value: "{{ .Values.usageCache.retentionPeriod }}"
            - name: ENABLE_USAGE_REPORT
              value: "{{ .Values.enablePeriodUsageReport }}"
          command: ["uvicorn"]
          args:
            - "report_api:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--log-level"
            - "{{ .Values.logLevel | lower }}"
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          {{- if .Values.storageProvisioning }}
          volumeMounts:
            - name: usage-cache
              mountPath: /usage_cache
          {{- end }}
      {{- if .Values.storageProvisioning }}
      volumes:
        - name: usage-cache
          persistentVolumeClaim:
            claimName: {{ .Values.storageProvisioning.existingClaim | default "aipub-report-cache" }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{ toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{ toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{ toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
