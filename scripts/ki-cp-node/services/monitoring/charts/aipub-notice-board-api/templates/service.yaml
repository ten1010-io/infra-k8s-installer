apiVersion: v1
kind: Service
metadata:
  name: {{ include "aipub-notice-board-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    aipub.ten1010.io/username: kubernetes-admin
  labels:
    {{- include "aipub-notice-board-api.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aipub-notice-board-api.selectorLabels" . | nindent 4 }}
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
  type: ClusterIP