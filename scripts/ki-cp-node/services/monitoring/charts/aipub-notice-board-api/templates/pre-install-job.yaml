{{- if eq .Values.storageProvisioning.type "static" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aipub-notice-board-api.fullname" . }}-storage-setup
  labels:
    {{- include "aipub-notice-board-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      {{- if eq .Values.storageProvisioning.static.type "local" }}
      {{- if .Values.storageProvisioning.static.local.nodeSelector }}
      nodeSelector:
        {{- range .Values.storageProvisioning.static.local.nodeSelector }}
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      containers:
        - name: storage-setup
          {{- if .Values.preInstallJob.image.registry }}
          image: "{{ .Values.preInstallJob.image.registry }}/{{ .Values.preInstallJob.image.repository }}:{{ .Values.preInstallJob.image.tag }}"
          {{- else }}
          image: "{{ .Values.preInstallJob.image.repository }}:{{ .Values.preInstallJob.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.preInstallJob.image.pullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh"]
          args:
            - -c
            - |
              {{- if eq .Values.storageProvisioning.static.type "local" }}
              echo "Creating local directory: {{ .Values.storageProvisioning.static.local.path }}"
              mkdir -p {{ .Values.storageProvisioning.static.local.path }}
              chmod -R 777 {{ .Values.storageProvisioning.static.local.path }}
              echo "Local directory setup completed"
              {{- else if eq .Values.storageProvisioning.static.type "nfs" }}
              echo "Creating NFS directory: {{ include "aipub-notice-board-api.nfsPath" . }}"
              mkdir -p {{ include "aipub-notice-board-api.nfsPath" . }}
              chmod -R 777 {{ include "aipub-notice-board-api.nfsPath" . }}
              echo "NFS directory setup completed"
              {{- end }}
          volumeMounts:
            {{- if eq .Values.storageProvisioning.static.type "local" }}
            - name: storage-volume
              mountPath: {{ .Values.storageProvisioning.static.local.path }}
            {{- else if eq .Values.storageProvisioning.static.type "nfs" }}
            - name: nfs-volume
              mountPath: {{ .Values.storageProvisioning.static.nfs.export }}
            {{- end }}
      volumes:
        {{- if eq .Values.storageProvisioning.static.type "local" }}
        - name: storage-volume
          hostPath:
            path: {{ .Values.storageProvisioning.static.local.path }}
        {{- else if eq .Values.storageProvisioning.static.type "nfs" }}
        - name: nfs-volume
          nfs:
            server: {{ .Values.storageProvisioning.static.nfs.server }}
            path: {{ .Values.storageProvisioning.static.nfs.export }}
        {{- end }}
      restartPolicy: Never
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  backoffLimit: 3
{{- end }}
