{{- if and (.Values.ingress.enabled) (.Values.ingress.createTls.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aipub-notice-board-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1g"
spec:
  ingressClassName: {{ .Values.ingress.className | default "lb1" }}
  rules:
  - host: {{ .Values.ingress.hostname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "aipub-notice-board-api.fullname" . }}
            port:
              number: {{ .Values.service.port }}
  tls:
    - hosts:
      - {{ .Values.ingress.hostname }}
      secretName: "{{ .Values.ingress.hostname }}-tls"
{{- end }}