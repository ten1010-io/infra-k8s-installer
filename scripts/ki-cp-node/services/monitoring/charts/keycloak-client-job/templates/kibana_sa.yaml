---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-kibana-sa
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kibana-client-config-reader
  namespace: {{ .Values.keycloak.namespace }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-kibana-secret-reader-binding
  namespace: {{ .Values.keycloak.namespace }}
subjects:
- kind: ServiceAccount
  name: keycloak-kibana-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: kibana-client-config-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kibana-client-config-writer
  namespace: {{ .Values.kibana.namespace }}
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kibana-client-config-writer-binding
  namespace: {{ .Values.kibana.namespace }}
subjects:
- kind: ServiceAccount
  name: keycloak-kibana-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: kibana-client-config-writer
  apiGroup: rbac.authorization.k8s.io