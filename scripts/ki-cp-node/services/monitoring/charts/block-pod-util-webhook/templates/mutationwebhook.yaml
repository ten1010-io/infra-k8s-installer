apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ .Release.Name }}-mutationwebhook
webhooks:
  - name: {{ .Release.Name }}-svc.{{ .Release.Namespace }}.svc
    failurePolicy: Ignore
    sideEffects: None
    timeoutSeconds: 10
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ .Release.Name }}-svc
        namespace: {{ .Release.Namespace }}
        path: "/mutate"
      caBundle: {{ if .Files.Get "ca.crt" }}{{ .Files.Get "ca.crt" | b64enc }}{{ else }}{{ .Values.caCrt | b64enc }}{{ end }}
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: "*"
    {{- if .Values.namespaceSelector }}
    namespaceSelector:
      {{- if .Values.namespaceSelector.matchLabels }}
      matchLabels:
        {{- toYaml .Values.namespaceSelector.matchLabels | nindent 8 }}
      {{- end }}
      {{- if .Values.namespaceSelector.matchExpressions }}
      matchExpressions:
        {{- toYaml .Values.namespaceSelector.matchExpressions | nindent 8 }}
      {{- end }}
    {{- end }}