        - record: gpu:resource:requests
          expr: |
            kube_pod_container_resource_requests{
              resource=~"ten1010_io_gpu_.*",
              resource!~".*_mig_.*",
              resource!~".*_block_.*"
            } * on(namespace, pod, container, uid) group_left() (kube_pod_container_status_running == 1)
          labels:
            gpu_type: "gpu"
   
        # A30 MIG 1g-4g
        - record: gpu:resource:requests
          expr: |
            kube_pod_container_resource_requests{
              resource=~"ten1010_io_gpu_.*",
              resource=~".*_nvidia_a30_.*",
