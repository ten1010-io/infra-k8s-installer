########### Alert rule & Alert Manager

alertmanager:
  enabled: true
  serviceMonitor:
    selfMonitor: false
  alertmanagerSpec:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    image:
      # ten1010.io registry 주소가 있는 이미지는 폐쇄망 환경에서 빌드할떄 활용하는 이미지이므로, 외부 접근이 허용된 경우에는 images 를 주석처리한다.
      registry: ten1010.io
      repository: prometheus/alertmanager
      tag: v0.27.0
      sha: ""
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'alertname'
          - 'instance'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'alertname'
          - 'instance'
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 720h # prometheus의 retention period와 동일하게 설정.
      receiver: 'null'
      routes:
      - receiver: 'null'
        matchers:
          - alertname = "Watchdog"
      - receiver: 'custom-webhook'
        matchers:
          - target = "aipub"
          - alertname !~ "InfoInhibitor"   
    receivers:
    - name: 'null'
    - name: 'custom-webhook'
      webhook_configs:
      #- url: 'http://192.168.2.2:23456/webhook' 
      - url: 'http://prom-infra-alerter.efk.svc.cluster.local:80/webhook'
        send_resolved: false
    templates:
    - '/etc/alertmanager/config/*.tmpl'

additionalPrometheusRules:
 - name: aipub-rule
   groups:
      - name: scheduler
        rules:
        - alert: scheduleStop1h
          expr: |
             kube_deployment_spec_replicas{namespace="coaster", deployment="scheduler"} == 0
          for: 1h
          labels:
            severity: info
            target: aipub
          annotations:
            summary: "schedule is stopped for 1h"
            description: |
              스케줄러 작동이 중지된지 1시간이 경과되었습니다.
              스케줄러 작동을 재개해야 리소스 할당과 워크로드 생성이 가능합니다.
      - name: aipub-master
        rules:
        - alert: MasterFault
          expr: |
             (
               kube_node_role{role="control-plane"}* on(node) group_right()
               sum by (node) (kube_node_status_condition{condition="Ready", status=~"false|unknown"})
             ) >= 1
          for: 1m
          labels:
            severity: critical
            target: aipub
          annotations:
            summary: "Master is dead"
            description: |
              ({{ $labels.node }}) 마스터노드에 장애가 발생하였습니다. 
        - alert: HighCPUUsageMaster
          expr: |
             (
               label_replace(
                 kube_node_role{role="control-plane"},
                 "instance",
                 "$1",
                 "node",
                 "(.*)"
               ) * on(instance) group_right()
               (
                 1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
               ) * 100
              ) >= 80
          for: 1m
          labels:
            severity: warning
            target: aipub
          annotations:
            summary: "High CPU usage detected"
            description: |
              ({{ $labels.instance }}) 마스터 노드의 CPU 사용률이 80%입니다.
              사용률이 95% 초과 시 AIPub 사용이 불가할 수 있습니다.
              CPU 리소스를 확보해주세요 
        - alert: HighCPUUsageMaster
          expr: |
             (
               label_replace(
                 kube_node_role{role="control-plane"},
                 "instance",
                 "$1",
                 "node",
                 "(.*)"
               ) * on(instance) group_right()
               (
                 1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
               ) * 100
              ) >= 90
          for: 1m
          labels:
            severity: critical
            target: aipub
          annotations:
            summary: "High CPU usage detected"
            description: |
              ({{ $labels.instance }}) 마스터 노드의 CPU 사용률이 90%입니다.
              사용률이 95% 초과 시 AIPub 사용이 불가할 수 있습니다.
              CPU 리소스를 확보해주세요
        - alert: HighRAMUsageMaster
          expr: |
             (
               label_replace(
                 kube_node_role{role="control-plane"},
                 "instance",
                 "$1",
                 "node",
                 "(.*)"
               ) * on(instance) group_right()
               (
                 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
               ) * 100
              ) >= 80
          for: 1m
          labels:
            severity: warning
            target: aipub
