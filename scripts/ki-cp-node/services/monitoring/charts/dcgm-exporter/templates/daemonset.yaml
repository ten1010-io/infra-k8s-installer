apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "dcgm-exporter.fullname" . }}
  namespace: {{ include "dcgm-exporter.namespace" . }}
  labels:
    {{- include "dcgm-exporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: "dcgm-exporter"
spec:
  updateStrategy:
    type: RollingUpdate
    {{- with .Values.rollingUpdate }}
    rollingUpdate:
      maxUnavailable: {{ .maxUnavailable }}
      maxSurge: {{ .maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "dcgm-exporter.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: "dcgm-exporter"
  template:
    metadata:
      labels:
        {{- include "dcgm-exporter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: "dcgm-exporter"
      {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      {{- end }}
      {{- if .Values.podAnnotations }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClassName | default "system-node-critical" }}
      {{- if .Values.hostNetwork }}
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dcgm-exporter.serviceAccountName" . }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      volumes:
      - name: "pod-gpu-resources"
        hostPath:
          path: {{ .Values.kubeletPath }}
      {{- if and .Values.tlsServerConfig.enabled }}
      - name: "tls"
        secret:
          secretName: {{ include "dcgm-exporter.tlsCertsSecretName" . }}
          defaultMode: 0664
      {{- end }}
      {{- if or .Values.tlsServerConfig.enabled $.Values.basicAuth.users}}
      - name: "web-config-yaml"
        configMap:
          name: {{ include "dcgm-exporter.webConfigConfigMap" . }}
          defaultMode: 0664
      {{- end }}
      {{- range .Values.extraHostVolumes }}
      - name: {{ .name | quote }}
        hostPath:
          path: {{ .hostPath | quote }}
      {{- end }}
      {{- with .Values.extraConfigMapVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: exporter
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        #command:
        #- "/scripts/restart.sh"        
        args:
        {{- range $.Values.arguments }}
        - {{ . }}
        {{- end }}
        env:
        - name: NVIDIA_VISIBLE_DEVICES 
          value: all
        - name: NVIDIA_MIG_CONFIG_DEVICES #MIG 설정을 위한 환경변수
          value: all
        - name: NVIDIA_MIG_MONITOR_DEVICES #MIG 모니터링을 위한 환경변수
          value: all
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: "DCGM_EXPORTER_KUBERNETES"
          value: "true"
        - name: "DCGM_EXPORTER_LISTEN"
          value: "{{ .Values.service.address }}"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        {{- if or .Values.tlsServerConfig.enabled $.Values.basicAuth.users}}
        - name: "DCGM_EXPORTER_WEB_CONFIG_FILE"
          value: /etc/dcgm-exporter/web-config.yaml
        {{- end }}
        {{- if .Values.extraEnv }}
        {{- toYaml .Values.extraEnv | nindent 8 }}
        {{- end }}
        ports:
        - name: "metrics"
          containerPort: {{ .Values.service.port }}
        volumeMounts:
        - name: "pod-gpu-resources"
          readOnly: true
          mountPath: "/var/lib/kubelet/pod-resources"
        {{- if and .Values.tlsServerConfig.enabled }}
        - name: "tls"
          mountPath: /etc/dcgm-exporter/tls
        {{- end }}
        {{- if or .Values.tlsServerConfig.enabled $.Values.basicAuth.users}}
        - name: "web-config-yaml"
          mountPath: /etc/dcgm-exporter/web-config.yaml
          subPath: web-config.yaml
        {{- end }}
        {{- if .Values.extraVolumeMounts }}
        {{- toYaml .Values.extraVolumeMounts | nindent 8 }}
        {{- end }}
        livenessProbe:
          exec:
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail

                HOST="localhost"
                PORT="{{ .Values.service.port }}"
                METRIC="DCGM_FI_PROF_SM_ACTIVE{"
                REQUIRE_SM_ACTIVE="{{ .Values.livenessProbe.requireSmActive | default false }}"

                fetch_path() {
                  local path=$1
                  exec 3<>/dev/tcp/${HOST}/${PORT} || return 1
                  printf 'GET %s HTTP/1.0\r\nHost: %s\r\n\r\n' "${path}" "${HOST}" >&3
                  if ! RESPONSE="$(timeout 5s cat <&3)"; then
                    exec 3>&-
                    return 1
                  fi
                  exec 3>&-
                  printf '%s' "${RESPONSE}"
                }

                # Health check is always required
                HEALTH_RESPONSE="$(fetch_path /health)" || exit 1
                if ! printf '%s\n' "${HEALTH_RESPONSE}" | head -n 1 | grep -q '200'; then
                  exit 1
                fi

                # SM_ACTIVE metric check is optional by default
                # Only fail if requireSmActive is true and metric is not found
                METRICS_RESPONSE="$(fetch_path /metrics)" || exit 1
                if printf '%s\n' "${METRICS_RESPONSE}" | grep -q "${METRIC}"; then
                  exit 0
                else
                  if [ "${REQUIRE_SM_ACTIVE}" = "true" ]; then
                    echo "metric ${METRIC} not found (required)" >&2
                    exit 1
                  else
                    echo "metric ${METRIC} not found (optional, continuing)" >&2
                    exit 0
                  fi
                fi
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 60 }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 5 }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          successThreshold: {{ .Values.livenessProbe.successThreshold | default 1 }}
        readinessProbe:
          {{- if not $.Values.basicAuth.users }}
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
            scheme: {{ ternary "HTTPS" "HTTP" $.Values.tlsServerConfig.enabled }}
          {{- else }}
          tcpSocket:
              port: {{ .Values.service.port }}
          {{- end }}
          initialDelaySeconds: 45
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
