{{- if .Values.ingress.createTls.enabled }}
{{- $certData := "" }}
{{- $keyData := "" }}

{{- if and (.Files.Get "tls.crt") (.Files.Get "tls.key") }}
  {{- $certData = .Files.Get "tls.crt" | b64enc }}
  {{- $keyData = .Files.Get "tls.key" | b64enc }}
{{- else if and .Values.ingress.createTls.certPath .Values.ingress.createTls.keyPath }}
  {{- $certData = .Files.Get .Values.ingress.createTls.certPath | b64enc }}
  {{- $keyData = .Files.Get .Values.ingress.createTls.keyPath | b64enc }}
{{- else if and .Values.ingress.createTls.certData .Values.ingress.createTls.keyData }}
  {{- $certData = .Values.ingress.createTls.certData }}
  {{- $keyData = .Values.ingress.createTls.keyData }}
{{- end }}

{{- if and $certData $keyData }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "aipub-cluster-overview-api.fullname" . }}-tls"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aipub-cluster-overview-api.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $certData }}
  tls.key: {{ $keyData }}
{{- else }}
{{- fail "TLS is enabled but certificate data is missing. Please provide either certPath/keyPath or certData/keyData" }}
{{- end }}
{{- end }}
