apiVersion: v1
kind: Service
metadata:
  name: {{ include "aipub-cluster-overview-api.fullname" . }}
  namespace: {{ .Release.Namespace | default "aipub" }}
  annotations:
    aipub.ten1010.io/username: kubernetes-admin
  labels:
    {{- include "aipub-cluster-overview-api.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aipub-cluster-overview-api.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: ClusterIP
