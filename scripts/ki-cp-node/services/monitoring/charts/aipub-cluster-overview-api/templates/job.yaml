{{- if .Values.cacheWarmup.job.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aipub-cluster-overview-api.fullname" . }}-cache-warmup-init
  namespace: {{ .Release.Namespace }}
  labels:
    app: aipub-cluster-overview-cache-warmup-init
    {{- include "aipub-cluster-overview-api.labels" . | nindent 4 }}
  annotations:
    # Helm hook: 설치/업그레이드 후 실행
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.cacheWarmup.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.cacheWarmup.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.cacheWarmup.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: aipub-cluster-overview-cache-warmup-init
    spec:
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      containers:
        - name: cache-warmup-init
          image: {{ include "aipub-cluster-overview-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "cache_warmup.py"]
          resources:
            {{- toYaml .Values.cacheWarmup.resources | nindent 12 }}
          env:
            - name: AAA_API_GATEWAY_HOST
              value: "http://{{ include "aipub-cluster-overview-api.fullname" . }}:{{ .Values.service.port }}"
            - name: AAA_BACKEND_CORS_ORIGINS
              value: "http://localhost:8000"
            - name: AAA_PROMETHEUS_SCHEME
              value: "{{ .Values.prometheus.service.scheme }}"
            - name: AAA_PROMETHEUS_HOST
              value: "{{ .Values.prometheus.service.name }}.{{ .Values.prometheus.namespace }}.svc.cluster.local"
            - name: AAA_PROMETHEUS_PORT
              value: "{{ .Values.prometheus.service.port }}"
            - name: AAA_PROMETHEUS_TIMEOUT
              value: "{{ .Values.prometheus.timeoutSeconds }}"
            - name: AAA_IGNORE_NAMESPACES
              value: "{{ join "," .Values.ignoreNamespaces }}"
      restartPolicy: OnFailure
{{- end }}
