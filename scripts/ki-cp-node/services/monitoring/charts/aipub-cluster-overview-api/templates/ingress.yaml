{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aipub-cluster-overview-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aipub-cluster-overview-api.labels" . | nindent 4 }}
spec:
  ingressClassName: lb1
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    - hosts:
        - {{ .Values.ingress.hostname }}
      secretName: "{{ .Values.ingress.hostname }}-tls"
  {{- end }}
