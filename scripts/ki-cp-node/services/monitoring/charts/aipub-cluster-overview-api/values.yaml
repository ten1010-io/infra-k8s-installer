appVersion: "v0.1.0"

replicas: 1

image:
  repository: aipub-cluster-overview-api
  tag: "0.1.3"
  pullPolicy: Never

ignoreNamespaces:
  - aipub
  - aipub-efk
  - aipub-linkerd
  - aipub-promstack
  - coaster
  - ingress-nginx
  - kube-flannel
  - kube-flannel
  - kube-system
  - metallb
  - network-operator
  - project-controller

service:
  port: 8008
  targetPort: 8000

ingress:
  enabled: false
  className: lb1
  hostname: ""
  createTls:
    enabled: false
    certPath: ""  # Provide either certPath or certData if enabled is true.
    certData: ""
    keyPath: ""  # Provide either certPath or certData if enabled is true.
    keyData: ""

resources:
  requests:
    cpu: "500m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

prometheus:
  namespace: aipub-promstack
  service:
    scheme: http
    name: prometheus-kube-prometheus-prometheus
    port: 9090
  timeoutSeconds: 30

# Cache Warmup 설정
cacheWarmup:
  # CronJob 설정 (주기적 캐시 워밍업)
  cronjob:
    enabled: true
    schedule: "0 */12 * * *"  # 12시간마다 실행
    timeZone: "Asia/Seoul"
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
  # Job 설정 (Helm 배포 시 1회 실행)
  job:
    enabled: true
  # 공통 설정
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 300  # 완료 후 5분 뒤 자동 삭제
  resources:
    requests:
      cpu: "250m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
