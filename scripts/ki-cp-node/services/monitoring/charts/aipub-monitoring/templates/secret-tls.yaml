{{- if eq .Values.env.AUTH_TYPE "keycloak" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aipub-monitoring.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.ingress.tlsCertificate | b64enc }}
  tls.key: {{ .Values.ingress.tlsPrivateKey | b64enc }}
  ca.crt: {{ .Values.ingress.caCertificate | b64enc }}
{{- end }}
