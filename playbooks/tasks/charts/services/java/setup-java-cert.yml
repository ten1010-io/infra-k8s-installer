- hosts: k8s_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--config {{ ki_tmp_java_vars_path }}"
  tasks:
    - name: Execute setup-harbor.sh
      shell: "sudo {{ ki_env_scripts_path }}/k8s-node/charts/services/java/setup-java-cert.sh {{ vars_path_arg }}"
      when: inventory_hostname == k8s_cp_nodes | first
